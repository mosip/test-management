name: Daily Report Sync

on:
  schedule:
    - cron: '50 3 * * 1-5'
  workflow_dispatch:

# One run at a time. Envs on the same WireGuard slot are queued by the per-env
# concurrency group, and GitHub keeps only one pending job per group, so two
# overlapping runs could cancel each other's queued envs.
concurrency:
  group: update-reports
  cancel-in-progress: false

jobs:

  # Validates MINIO_ENVS and derives, per env, the secret-name key and an mc alias.
  # Secret names only allow [A-Z0-9_] and mc aliases must match ^[A-Za-z][A-Za-z0-9_-]*$,
  # so an env such as 131ga or qa-1.3 cannot be used as-is for either.
  #
  # Then gives every env its own WireGuard peer. A peer is one key pair, and the
  # server keeps a single endpoint per peer, so jobs sharing a key take the tunnel
  # from each other and get empty or partial listings. Envs are spread round-robin
  # over the WIREGUARD_CONF slots that are set: WIREGUARD_CONF, then _1 .. _4.
  plan:
    name: Plan environments
    runs-on: ubuntu-latest
    environment:
      name: daily-automation-reports
    outputs:
      matrix:  ${{ steps.assign.outputs.matrix }}
      count:   ${{ steps.resolve.outputs.count }}
      invalid: ${{ steps.resolve.outputs.invalid }}

    steps:
      - name: Resolve MINIO_ENVS
        id: resolve
        env:
          MINIO_ENVS: ${{ vars.MINIO_ENVS }}
        run: |
          if ! jq -e 'type == "array"' <<< "$MINIO_ENVS" > /dev/null 2>&1; then
            echo "::error::MINIO_ENVS must be a JSON array of env names, got: $MINIO_ENVS"
            exit 1
          fi

          # name:  letters, digits, dots, hyphens, underscores; no leading dot (upload-artifact skips hidden files)
          # key:   uppercased, anything outside A-Z0-9 becomes "_"  ->  MINIO_<key>_URL / _USER / _PASSWORD
          # alias: the name itself when mc accepts it, otherwise env_<name> with dots turned into "_"
          RESOLVED=$(jq -c '
            reduce .[] as $name ({include: [], invalid: [], seen: {}};
              if ($name | type) != "string" or ($name | test("^[A-Za-z0-9_-][A-Za-z0-9._-]*$") | not) then
                .invalid += [{env: ($name | tostring),
                              reason: "invalid name, use letters, digits, dots, hyphens and underscores, not starting with a dot"}]
              else
                ($name | ascii_upcase | gsub("[^A-Z0-9]"; "_")) as $key
                | if .seen[$key] == null then
                    .seen[$key] = $name
                    | .include += [{
                        env:   $name,
                        key:   $key,
                        alias: (if ($name | test("^[A-Za-z][A-Za-z0-9_-]*$")) then $name
                                else "env_" + ($name | gsub("[^A-Za-z0-9_-]"; "_")) end)
                      }]
                  elif .seen[$key] == $name then .
                  else
                    .invalid += [{env: $name,
                                  reason: "shares the MINIO_\($key)_* secrets with \(.seen[$key]), rename one of them"}]
                  end
              end)
            | {include, invalid}' <<< "$MINIO_ENVS")

          jq -r '.include[] | "\(.env): secrets MINIO_\(.key)_*, mc alias \(.alias)"' <<< "$RESOLVED"
          jq -r '.invalid[] | "::error::MINIO_ENVS entry \(.env | @json) skipped: \(.reason)"' <<< "$RESOLVED"

          {
            echo "include=$(jq -c '.include' <<< "$RESOLVED")"
            echo "count=$(jq '.include | length' <<< "$RESOLVED")"
            echo "invalid=$(jq -c '.invalid' <<< "$RESOLVED")"
          } >> "$GITHUB_OUTPUT"

      - name: Assign envs to WireGuard slots
        id: assign
        env:
          ENVS: ${{ steps.resolve.outputs.include }}
          WIREGUARD_CONF:   ${{ secrets.WIREGUARD_CONF }}
          WIREGUARD_CONF_1: ${{ secrets.WIREGUARD_CONF_1 }}
          WIREGUARD_CONF_2: ${{ secrets.WIREGUARD_CONF_2 }}
          WIREGUARD_CONF_3: ${{ secrets.WIREGUARD_CONF_3 }}
          WIREGUARD_CONF_4: ${{ secrets.WIREGUARD_CONF_4 }}
        run: |
          SLOTS=()
          declare -A KEY_OWNER ADDR_OWNER
          for NAME in WIREGUARD_CONF WIREGUARD_CONF_1 WIREGUARD_CONF_2 WIREGUARD_CONF_3 WIREGUARD_CONF_4; do
            CONF="${!NAME}"
            [ -z "$CONF" ] && continue

            # Two slots with the same key or tunnel address are one peer, and
            # would roam exactly like a single shared config.
            KEY=$(printf '%s\n' "$CONF" | sed -n 's/^[[:space:]]*PrivateKey[[:space:]]*=[[:space:]]*//p' | sha256sum | cut -c1-16)
            # A bare address means /32 to wg-quick, so compare it that way.
            ADDR=$(printf '%s\n' "$CONF" | sed -n 's/^[[:space:]]*Address[[:space:]]*=[[:space:]]*//p' \
                     | tr -d '[:space:]' | sed -E 's#^([0-9.]+)$#\1/32#')
            if [ -n "${KEY_OWNER[$KEY]:-}" ]; then
              echo "::error::$NAME has the same PrivateKey as ${KEY_OWNER[$KEY]}. Every slot needs its own WireGuard peer."
              exit 1
            fi
            if [ -n "${ADDR_OWNER[$ADDR]:-}" ]; then
              echo "::error::$NAME has the same Address as ${ADDR_OWNER[$ADDR]}. Every slot needs its own tunnel address."
              exit 1
            fi
            KEY_OWNER[$KEY]=$NAME
            ADDR_OWNER[$ADDR]=$NAME
            SLOTS+=("$NAME")
          done

          if [ ${#SLOTS[@]} -eq 0 ]; then
            echo "::error::No WIREGUARD_CONF secret is set."
            exit 1
          fi
          echo "WireGuard slots: ${SLOTS[*]}"

          # `group` is the concurrency group: envs on the same slot queue behind each other.
          MATRIX=$(jq -c '[to_entries[] | $ARGS.positional[.key % ($ARGS.positional | length)] as $wg
                           | .value + {wg: $wg, group: $wg}]' \
                     --args "${SLOTS[@]}" <<< "$ENVS")

          # A slot runs one env and queues one more. A third would make GitHub
          # cancel the queued one, so with too few slots fall back to running
          # every env at once on shared keys, the way it worked before slots.
          ENV_COUNT=$(jq length <<< "$MATRIX")
          PER_SLOT=$(jq '[group_by(.wg)[] | length] | max // 0' <<< "$MATRIX")
          if [ "$PER_SLOT" -gt 2 ]; then
            echo "::warning::$ENV_COUNT envs need at least $(( (ENV_COUNT + 1) / 2 )) WireGuard slots and only ${#SLOTS[@]} are set, so envs share keys and scans may come back partial. Add WIREGUARD_CONF_<n> secrets."
            MATRIX=$(jq -c 'map(.group = "\(.wg)-\(.env)")' <<< "$MATRIX")
          fi

          jq -r '.[] | "\(.env) -> \(.wg)"' <<< "$MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  # Runs once per env in MINIO_ENVS in parallel — connects to MinIO via WireGuard and generates a CSV
  per-env:
    name: "env: ${{ matrix.env }}"
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # A healthy scan takes about two minutes. The cap stops a stuck scan from
    # holding its WireGuard slot, and the env queued behind it, for hours.
    timeout-minutes: 15
    # A failed env shows as a failed job, but it is a result, not a broken
    # workflow, so it does not fail the run. Summary reports it.
    continue-on-error: true
    environment:
      name: daily-automation-reports

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}

    # Envs that share a WireGuard slot run one after the other, never together.
    concurrency:
      group: ${{ matrix.group }}
      cancel-in-progress: false

    env:
      MINIO_URL:      ${{ secrets[format('MINIO_{0}_URL',      matrix.key)] }}
      MINIO_USER:     ${{ secrets[format('MINIO_{0}_USER',     matrix.key)] }}
      MINIO_PASSWORD: ${{ secrets[format('MINIO_{0}_PASSWORD', matrix.key)] }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: daily-automation-reports

      - name: Reset per-env collected files
        run: |
          mkdir -p minio-report-tracker/csv minio-report-tracker/status
          rm -f minio-report-tracker/csv/*.csv
          rm -f minio-report-tracker/status/*.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Only what update_csv.py and update_sheet.py import; the XLSX libraries
      # (matplotlib, openpyxl) are needed by Summary alone.
      - name: Install Python dependencies
        run: |
          pip install pandas gspread oauth2client google-api-python-client google-auth

      - name: Install WireGuard
        run: sudo apt-get install -y wireguard

      - name: Configure WireGuard
        env:
          WG_CONF: ${{ secrets[matrix.wg] }}
        run: |
          printf '%s\n' "$WG_CONF" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          # Public key and tunnel address are not secret; distinct slots must show distinct values.
          echo "env '${{ matrix.env }}' on ${{ matrix.wg }}: public key $(sudo wg show wg0 public-key), address $(ip -4 -o addr show wg0 | awk '{print $4}')"

      - name: Verify WireGuard tunnel
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "=== WireGuard interface state ==="
          sudo wg show
          echo ""
          echo "=== Routing table (first 30 lines) ==="
          ip route show | head -30

      - name: Install MinIO Client
        env:
          # dl.min.io no longer serves community mc builds (410 Gone); use the GitHub release asset.
          MC_VERSION: RELEASE.2025-08-13T08-35-41Z
          MC_SHA256: 01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891
        run: |
          curl -fsSL \
            "https://github.com/minio/mc/releases/download/${MC_VERSION}/mc.linux-amd64.${MC_VERSION}" \
            -o mc
          echo "${MC_SHA256}  mc" | sha256sum -c -
          chmod +x mc
          sudo mv mc /usr/local/bin/
          mc --version

      # An env that cannot be reached is a result, not a broken workflow: record
      # why, skip the scan, and let the env be reported as failed while the job
      # (and the run) stays green.
      - name: Configure MinIO Alias
        id: configure_minio
        run: |
          ALIAS="${{ matrix.alias }}"
          echo "Configuring mc alias '$ALIAS' for env '${{ matrix.env }}' -> $MINIO_URL"

          if [ -z "$MINIO_URL" ] || [ -z "$MINIO_USER" ] || [ -z "$MINIO_PASSWORD" ]; then
            REASON="One or more MinIO secrets are empty for env '${{ matrix.env }}'. Expected: MINIO_${{ matrix.key }}_URL / _USER / _PASSWORD"
          elif ! mc alias set "$ALIAS" "$MINIO_URL" "$MINIO_USER" "$MINIO_PASSWORD" --api S3v2; then
            REASON="Could not configure the mc alias for env '${{ matrix.env }}'."
          else
            echo "Alias '$ALIAS' configured."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$REASON"
          echo "$REASON" > /tmp/step_failure_reason.txt
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Debug MinIO raw listings
        if: github.event_name == 'workflow_dispatch' && steps.configure_minio.outputs.ready == 'true'
        run: |
          ALIAS="${{ matrix.alias }}"
          echo "== $ALIAS/dslreports/full =="
          timeout 15s mc ls --json "$ALIAS/dslreports/full/" || true
          echo ""
          echo "== $ALIAS/uitestrig root =="
          timeout 15s mc ls --json "$ALIAS/uitestrig/" || true
          echo ""
          echo "== $ALIAS/apitestrig root =="
          timeout 15s mc ls --json "$ALIAS/apitestrig/" || true
          echo ""
          echo "== $ALIAS/automation root =="
          timeout 15s mc ls --json "$ALIAS/automation/" || true

      - name: Run CSV generation
        id: run_csv_generation
        if: steps.configure_minio.outputs.ready == 'true'
        run: |
          export MINIO_ENV="${{ matrix.env }}"
          export MINIO_MC_ALIAS="${{ matrix.alias }}"
          python minio-report-tracker/scripts/update_csv.py

      - name: Debug generated outputs
        if: github.event_name == 'workflow_dispatch' && steps.configure_minio.outputs.ready == 'true'
        run: |
          echo "== ../csv =="
          ls -la ../csv || echo "(directory does not exist)"
          echo ""
          echo "== ../status =="
          ls -la ../status || echo "(directory does not exist)"
          echo ""
          echo "== status payload =="
          cat "../status/status_${{ matrix.env }}.json" || echo "(file not found)"

      - name: Collect generated CSV and status files
        if: always()
        run: |
          mkdir -p minio-report-tracker/csv minio-report-tracker/status

          CSV_SRC="../csv/${{ matrix.env }}.csv"
          if [ -f "$CSV_SRC" ]; then
            cp "$CSV_SRC" "minio-report-tracker/csv/${{ matrix.env }}.csv"
            echo "CSV collected."
          else
            echo "No CSV found at $CSV_SRC — MinIO scan may have returned no data."
          fi

          STATUS_SRC="../status/status_${{ matrix.env }}.json"
          if [ -f "$STATUS_SRC" ]; then
            cp "$STATUS_SRC" "minio-report-tracker/status/status_${{ matrix.env }}.json"
            echo "Status file collected."
          else
            echo "No status file found at $STATUS_SRC."
          fi

      # success: every listing read. partial: MinIO answered but some listings
      # failed or it held no recent reports. failed: nothing could be fetched,
      # including a job that stopped before update_csv.py reported.
      - name: Normalize per-env status
        if: always()
        env:
          ENV_NAME: ${{ matrix.env }}
        run: |
          CSV_FILE="minio-report-tracker/csv/$ENV_NAME.csv"
          STATUS_FILE="minio-report-tracker/status/status_$ENV_NAME.json"
          ORIG_STATUS="../status/status_$ENV_NAME.json"
          mkdir -p minio-report-tracker/status

          STATE=""; REASON=""; LISTINGS="[]"
          if [ -f "$ORIG_STATUS" ]; then
            STATE=$(jq -r --arg env "$ENV_NAME" '.details[$env].state // ""' "$ORIG_STATUS")
            REASON=$(jq -r --arg env "$ENV_NAME" '.details[$env].reason // ""' "$ORIG_STATUS")
            LISTINGS=$(jq -c --arg env "$ENV_NAME" '.details[$env].failed_listings // []' "$ORIG_STATUS")
          fi
          if [ -z "$STATE" ]; then
            STATE=failed
            REASON=$(cat /tmp/step_failure_reason.txt 2>/dev/null || true)
            REASON=${REASON:-"The scan did not finish; see this job's log."}
          elif [ "$STATE" = success ] && [ ! -f "$CSV_FILE" ]; then
            STATE=failed
            REASON="The scan finished but no CSV was collected."
          fi

          jq -n --arg env "$ENV_NAME" --arg state "$STATE" --arg reason "$REASON" --argjson listings "$LISTINGS" '{
            state: $state, reason: $reason, failed_listings: $listings,
            success: (if $state == "success" then [$env] else [] end),
            partial: (if $state == "partial" then [$env] else [] end),
            failed:  (if $state == "failed"  then [$env] else [] end)
          }' > "$STATUS_FILE"
          echo "Status written: $(cat "$STATUS_FILE")"

      # Write this env's tab now rather than waiting for every env to finish.
      # If it cannot (e.g. Google's quota stays exhausted), Summary writes it.
      - name: Update Google Sheet
        if: always()
        continue-on-error: true
        env:
          ENV_NAME: ${{ matrix.env }}
          GSHEETCREDS: ${{ secrets.GSHEETCREDS }}
        run: |
          printf '%s' "$GSHEETCREDS" > creds.json
          SHEET_CSV_DIR=minio-report-tracker/csv \
          SHEET_STATUS_DIR=minio-report-tracker/status \
          SHEET_REPORT="minio-report-tracker/status/sheet_$ENV_NAME.json" \
            python minio-report-tracker/scripts/update_sheet.py

      - name: Debug collected files
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "== minio-report-tracker/csv =="
          ls -la minio-report-tracker/csv || echo "No CSV files"
          echo ""
          echo "== minio-report-tracker/status =="
          ls -la minio-report-tracker/status || echo "No status files"

      - name: Upload CSV artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: csv-${{ matrix.env }}
          path: minio-report-tracker/csv/${{ matrix.env }}.csv
          if-no-files-found: ignore

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: status-${{ matrix.env }}
          path: |
            minio-report-tracker/status/status_${{ matrix.env }}.json
            minio-report-tracker/status/sheet_${{ matrix.env }}.json
          if-no-files-found: error

      # Last, so the CSV, status and sheet write above have already happened.
      - name: Report env result
        if: always()
        env:
          STATUS_FILE: minio-report-tracker/status/status_${{ matrix.env }}.json
        run: |
          STATE=$(jq -r '.state // "failed"' "$STATUS_FILE" 2>/dev/null || echo failed)
          REASON=$(jq -r '.reason // ""' "$STATUS_FILE" 2>/dev/null || true)
          case "$STATE" in
            success) echo "${{ matrix.env }}: success" ;;
            partial) echo "::warning title=${{ matrix.env }} partial::$REASON" ;;
            *)       echo "::error title=${{ matrix.env }} failed::${REASON:-no status was written}"
                     exit 1 ;;
          esac

  # Waits for all per-env jobs, generates the XLSX, writes any tab an env job could
  # not, reports the Google Sheets quota, and notifies Slack about partial or failed envs
  summary:
    name: Summary
    needs: [plan, per-env]
    runs-on: ubuntu-latest
    if: always()
    environment:
      name: daily-automation-reports

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: daily-automation-reports

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pandas matplotlib openpyxl gspread oauth2client \
                      gspread-formatting google-api-python-client google-auth

      - name: Reset collected report folders
        run: |
          rm -rf artifacts
          mkdir -p artifacts minio-report-tracker/csv minio-report-tracker/xlxs status
          rm -f minio-report-tracker/csv/*.csv
          rm -f minio-report-tracker/xlxs/*.xlsx
          rm -f status/*.json

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect CSVs from artifacts
        run: |
          mkdir -p minio-report-tracker/csv
          find artifacts -name "*.csv" -exec cp {} minio-report-tracker/csv/ \;

      - name: Collect status files from artifacts
        run: |
          mkdir -p status sheet-reports
          find artifacts -name "status_*.json" -exec cp {} status/ \;
          find artifacts -name "sheet_*.json" -exec cp {} sheet-reports/ \;

      - name: Debug aggregate inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "=== Downloaded artifact tree ==="
          find artifacts -maxdepth 3 -type f | sort || true
          echo ""
          echo "=== Collected CSVs ==="
          ls -la minio-report-tracker/csv || true
          echo ""
          echo "=== Collected status files ==="
          ls -la status || true

      # Every planned env is classified, so an env whose job never reported
      # (cancelled, timed out) is counted as failed rather than left out.
      - name: Generate workflow summary
        env:
          PLAN_RESULT:  ${{ needs.plan.result }}
          PLANNED:      ${{ needs.plan.outputs.matrix }}
          INVALID_ENVS: ${{ needs.plan.outputs.invalid }}
        run: |
          SUCCESS=""; PARTIAL=""; FAILED=""; NEEDS_SHEET=""
          ROWS=""

          for ENV_NAME in $(jq -r '.[].env' <<< "${PLANNED:-[]}"); do
            STATUS="status/status_$ENV_NAME.json"
            if [ -f "$STATUS" ]; then
              STATE=$(jq -r '.state // "failed"' "$STATUS")
              REASON=$(jq -r '.reason // ""' "$STATUS")
            else
              STATE=failed
              REASON="The env job stopped before it reported (cancelled or timed out)."
              jq -n --arg env "$ENV_NAME" --arg reason "$REASON" \
                '{state: "failed", reason: $reason, success: [], partial: [], failed: [$env]}' > "$STATUS"
            fi
            case "$STATE" in
              success) SUCCESS="$SUCCESS $ENV_NAME"; ICON=":white_check_mark:" ;;
              partial) PARTIAL="$PARTIAL $ENV_NAME"; ICON=":warning:" ;;
              *)       FAILED="$FAILED $ENV_NAME";   ICON=":x:" ;;
            esac
            ROWS="$ROWS| \`$ENV_NAME\` | $ICON $STATE | ${REASON//|/\\|} |"$'\n'

            # Summary writes the tab when the env job did not, or not completely.
            REPORT="sheet-reports/sheet_$ENV_NAME.json"
            if [ ! -f "$REPORT" ] || [ "$(jq '.not_written | length' "$REPORT")" -gt 0 ]; then
              NEEDS_SHEET="$NEEDS_SHEET $ENV_NAME"
            fi
          done

          # MINIO_ENVS entries that never got a job
          if [ "$PLAN_RESULT" != "success" ]; then
            FAILED="$FAILED MINIO_ENVS"
            ROWS="$ROWS| MINIO_ENVS | :x: failed | not a JSON array of env names, or no WireGuard config |"$'\n'
          fi
          while IFS=$'\t' read -r INVALID_NAME INVALID_REASON; do
            [ -n "$INVALID_NAME" ] || continue
            FAILED="$FAILED $INVALID_NAME"
            ROWS="$ROWS| \`$INVALID_NAME\` | :x: failed | $INVALID_REASON |"$'\n'
          done < <(jq -r '.[] | [(.env | gsub("\\s"; "_")), .reason] | @tsv' <<< "${INVALID_ENVS:-[]}")

          {
            echo "## MinIO Environment Summary"
            echo ""
            echo "| Env | Result | Detail |"
            echo "|---|---|---|"
            printf '%s' "$ROWS"
          } >> $GITHUB_STEP_SUMMARY

          echo "SUCCESS_ENVS=${SUCCESS# }" >> $GITHUB_ENV
          echo "PARTIAL_ENVS=${PARTIAL# }" >> $GITHUB_ENV
          echo "FAILED_ENVS=${FAILED# }" >> $GITHUB_ENV
          echo "NEEDS_SHEET_ENVS=${NEEDS_SHEET# }" >> $GITHUB_ENV

      - name: Generate XLSX
        if: ${{ env.SUCCESS_ENVS != '' || env.PARTIAL_ENVS != '' }}
        run: python minio-report-tracker/scripts/generate_xlsx.py

      - name: Update Google Sheet for envs their own job could not write
        if: ${{ env.NEEDS_SHEET_ENVS != '' }}
        continue-on-error: true
        env:
          GSHEETCREDS: ${{ secrets.GSHEETCREDS }}
        run: |
          printf '%s' "$GSHEETCREDS" > creds.json
          mkdir -p fallback/csv fallback/status
          for ENV_NAME in $NEEDS_SHEET_ENVS; do
            cp "minio-report-tracker/csv/$ENV_NAME.csv" fallback/csv/ 2>/dev/null || true
            cp "status/status_$ENV_NAME.json" fallback/status/
          done
          SHEET_CSV_DIR=fallback/csv SHEET_STATUS_DIR=fallback/status \
          SHEET_REPORT=sheet-reports/summary.json \
            python minio-report-tracker/scripts/update_sheet.py

      # Every env writes through one Google service account, which allows about
      # 60 writes a minute. Say whether that limit was hit and what it cost.
      - name: Report Google Sheets quota
        if: always()
        run: |
          shopt -s nullglob
          REPORTS=(sheet-reports/*.json)
          HITS=0; WAITED=0
          for R in "${REPORTS[@]}"; do
            HITS=$(( HITS + $(jq '.quota_hits // 0' "$R") ))
            WAITED=$(( WAITED + $(jq '.quota_waited_s // 0' "$R") ))
          done

          # Tabs still unwritten: what the Summary write could not do, or every
          # tab it was asked to write if it did not get as far as reporting.
          UNWRITTEN=""
          if [ -n "$NEEDS_SHEET_ENVS" ]; then
            if [ -f sheet-reports/summary.json ]; then
              UNWRITTEN=$(jq -r '.not_written | to_entries[] | "\(.key): \(.value)"' sheet-reports/summary.json)
            else
              UNWRITTEN=$(printf '%s: not written\n' $NEEDS_SHEET_ENVS)
            fi
          fi

          {
            echo ""
            echo "### Google Sheets quota"
            if [ "$HITS" -eq 0 ]; then
              echo "Not hit."
            else
              echo ":warning: Google's write quota was hit **$HITS** time(s); the run waited **${WAITED}s** in total to retry."
            fi
            if [ -n "$UNWRITTEN" ]; then
              echo ""
              echo ":x: These tabs were **not written**. Rerun those envs or fill them by hand:"
              echo '```'
              echo "$UNWRITTEN"
              echo '```'
            elif [ "$HITS" -gt 0 ]; then
              echo "Every tab was written after retrying."
            fi
          } >> $GITHUB_STEP_SUMMARY
          echo "Quota hits: $HITS, waited ${WAITED}s"
          # One line, no stray whitespace: an empty value must stay empty for the Slack condition.
          echo "UNWRITTEN_TABS=$(echo $UNWRITTEN)" >> $GITHUB_ENV

      - name: Notify Slack
        if: ${{ always() && (env.FAILED_ENVS != '' || env.PARTIAL_ENVS != '' || env.UNWRITTEN_TABS != '') }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.TEST_AUTOMATION_SLACK_WEBHOOK }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No Slack webhook configured; skipping notification. PARTIAL_ENVS=$PARTIAL_ENVS FAILED_ENVS=$FAILED_ENVS UNWRITTEN_TABS=$UNWRITTEN_TABS"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DATE=$(date +'%d %b %Y')

          NOTE=""
          if [ -n "$UNWRITTEN_TABS" ]; then
            NOTE="Google Sheet tabs not written: $UNWRITTEN_TABS"
          fi
          as_json() { jq -nc --arg s "$1" '$s | split(" ") | map(select(. != ""))'; }

          # Passed | Partial | Failed side by side in a table block. Section fields
          # cannot do this: Slack always lays them out two per row.
          TABLE_PAYLOAD=$(jq -n \
            --arg date "$DATE" \
            --argjson passed "$(as_json "$SUCCESS_ENVS")" \
            --argjson partial "$(as_json "$PARTIAL_ENVS")" \
            --argjson failed "$(as_json "$FAILED_ENVS")" \
            --arg note "$NOTE" \
            --arg url "$RUN_URL" \
            'def cell($emoji; $text; $style):
               { type: "rich_text", elements: [{ type: "rich_text_section", elements: [
                   { type: "emoji", name: $emoji },
                   { type: "text", text: (" " + $text), style: $style } ] }] };
             def column($list; $i; $emoji):
               if $i < ($list | length) then cell($emoji; $list[$i]; { code: true })
               else { type: "raw_text", text: " " } end;
             ([$passed, $partial, $failed] | map(length) | max) as $rows
             | {
                 text: ("MinIO Report — " + $date),
                 blocks: ([
                   { type: "header", text: { type: "plain_text", text: ("MinIO Report — " + $date), emoji: true } },
                   { type: "table", rows: (
                       [[ cell("white_check_mark"; "Passed"; { bold: true }),
                          cell("warning"; "Partial"; { bold: true }),
                          cell("x"; "Failed"; { bold: true }) ]]
                       + [ range(0; $rows) as $i
                           | [ column($passed; $i; "white_check_mark"),
                               column($partial; $i; "warning"),
                               column($failed; $i; "x") ] ]) }
                 ]
                 + (if $note != "" then [{ type: "section", text: { type: "mrkdwn", text: (":x: " + $note) } }] else [] end)
                 + [
                   { type: "divider" },
                   { type: "actions", elements: [
                       { type: "button", text: { type: "plain_text", text: "View Run", emoji: true }, url: $url, style: "primary" } ] }
                 ])
               }')

          # If Slack does not accept the table, send the same lists as fields
          # rather than lose the notification.
          list() { echo "$1" | tr ' ' '\n' | sed '/^$/d' | sed "s/^/$2 \`/" | sed 's/$/`/'; }
          FIELDS_PAYLOAD=$(jq -n \
            --arg date "$DATE" \
            --arg passed "$(list "$SUCCESS_ENVS" ":white_check_mark:")" \
            --arg partial "$(list "$PARTIAL_ENVS" ":warning:")" \
            --arg failed "$(list "$FAILED_ENVS" ":x:")" \
            --arg note "$NOTE" \
            --arg url "$RUN_URL" \
            '{
              text: ("MinIO Report — " + $date),
              blocks: ([
                { type: "header", text: { type: "plain_text", text: ("MinIO Report — " + $date), emoji: true } },
                { type: "section", fields: [
                    { type: "mrkdwn", text: ("*:white_check_mark: Passed*\n" + (if $passed == "" then "(none)" else $passed end)) },
                    { type: "mrkdwn", text: ("*:x: Failed*\n" + (if $failed == "" then "(none)" else $failed end)) } ] }
              ]
              + (if $partial != "" then [{ type: "section", text: { type: "mrkdwn", text: ("*:warning: Partial*\n" + $partial) } }] else [] end)
              + (if $note != "" then [{ type: "section", text: { type: "mrkdwn", text: (":x: " + $note) } }] else [] end)
              + [
                { type: "divider" },
                { type: "actions", elements: [
                    { type: "button", text: { type: "plain_text", text: "View Run", emoji: true }, url: $url, style: "primary" } ] }
              ])
            }')

          if ! curl -fsS -X POST -H 'Content-type: application/json' \
                 --data "$TABLE_PAYLOAD" "$SLACK_WEBHOOK_URL"; then
            echo "::warning::Slack did not accept the table layout; sent the two-column layout instead."
            curl -fsSL -X POST -H 'Content-type: application/json' \
                 --data "$FIELDS_PAYLOAD" "$SLACK_WEBHOOK_URL"
          fi

      - name: Fail if no environment produced reports
        run: |
          if [ -z "$SUCCESS_ENVS" ] && [ -z "$PARTIAL_ENVS" ]; then
            echo "No environment could be read. Check the per-env logs above."
            exit 1
          fi
