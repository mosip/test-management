name: Env Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - add
          - remove
      env_name:
        description: 'Environment name (e.g. qa22, 131ga, qa-1.3) — converted to lowercase'
        required: true
        type: string
      minio_url:
        description: 'MinIO URL (required for add)'
        required: false
        type: string
      minio_user:
        description: 'MinIO username (required for add)'
        required: false
        type: string
      minio_password:
        description: 'MinIO password (required for add)'
        required: false
        type: string

env:
  # update-reports.yml runs under this environment, and an environment secret
  # takes precedence over a repo secret of the same name. MinIO secrets must
  # be managed here, or a rotation is shadowed and a removal leaves them behind.
  SECRETS_ENVIRONMENT: daily-automation-reports

jobs:
  manage-env:
    runs-on: ubuntu-latest

    steps:
      # Inputs are not secrets, so GitHub prints them in every step's env block.
      # Mask the credentials before any step receives them as env.
      - name: Mask credentials
        run: |
          for KEY in minio_user minio_password; do
            VALUE=$(jq -r --arg k "$KEY" '.inputs[$k] // ""' "$GITHUB_EVENT_PATH")
            if [ -n "$VALUE" ]; then
              echo "::add-mask::$VALUE"
            fi
          done

      - name: Validate inputs
        id: validate
        env:
          ACTION:        ${{ inputs.action }}
          ENV_NAME:      ${{ inputs.env_name }}
          MINIO_URL:     ${{ inputs.minio_url }}
          MINIO_USER:    ${{ inputs.minio_user }}
          MINIO_PASSWORD: ${{ inputs.minio_password }}
        run: |
          # Env names and sheet tabs are lowercase, so QA22 is the same env as qa22
          ENV=$(printf '%s' "$ENV_NAME" | tr '[:upper:]' '[:lower:]')
          if [ "$ENV" != "$ENV_NAME" ]; then
            echo "Using env name '$ENV' for '$ENV_NAME'."
          fi

          if [[ ! "$ENV" =~ ^[a-z0-9_-][a-z0-9._-]*$ ]]; then
            echo "Invalid env name '$ENV_NAME'. Use letters, numbers, dots, hyphens, underscores only, not starting with a dot."
            exit 1
          fi
          echo "env_name=$ENV" >> $GITHUB_OUTPUT

          if [ "$ACTION" = "add" ]; then
            if [ -z "$MINIO_URL" ] || [ -z "$MINIO_USER" ] || [ -z "$MINIO_PASSWORD" ]; then
              echo "minio_url, minio_user, and minio_password are all required for action=add."
              exit 1
            fi
          fi

      - name: Read current MINIO_ENVS
        id: read_envs
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT }}
        run: |
          RAW=$(gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/variables/MINIO_ENVS \
            --jq '.value')

          CURRENT=$(echo "$RAW" | jq -c '.')
          echo "Current MINIO_ENVS: $CURRENT"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Add environment
        id: add_env
        if: inputs.action == 'add'
        env:
          GH_TOKEN:      ${{ secrets.ACTION_PAT }}
          ENV_NAME:      ${{ steps.validate.outputs.env_name }}
          CURRENT:       ${{ steps.read_envs.outputs.current }}
          MINIO_URL:     ${{ inputs.minio_url }}
          MINIO_USER:    ${{ inputs.minio_user }}
          MINIO_PASSWORD: ${{ inputs.minio_password }}
        run: |
          ENV="$ENV_NAME"
          # Same secret-name mapping as update-reports.yml: uppercase, anything outside A-Z0-9 becomes "_"
          ENV_UPPER=$(printf '%s' "$ENV" | tr '[:lower:]' '[:upper:]' | tr -c 'A-Z0-9' '_')

          CLASH=$(echo "$CURRENT" | jq -r --arg env "$ENV" --arg key "$ENV_UPPER" \
            'map(select(type == "string" and . != $env and (ascii_upcase | gsub("[^A-Z0-9]"; "_")) == $key)) | join(", ")')
          if [ -n "$CLASH" ]; then
            echo "::error::'$ENV' would share the MINIO_${ENV_UPPER}_* secrets with $CLASH. Pick a different name."
            exit 1
          fi

          EXISTS=$(echo "$CURRENT" | jq --arg env "$ENV" 'map(select(. == $env)) | length')

          if [ "$EXISTS" -gt 0 ]; then
            echo "::warning::Environment '$ENV' already exists in MINIO_ENVS — variable unchanged. Secrets will be updated."
            echo "ENV_STATUS=updated" >> $GITHUB_ENV
          else
            UPDATED=$(echo "$CURRENT" | jq --arg env "$ENV" '. + [$env]')
            echo "Updated MINIO_ENVS: $(echo "$UPDATED" | jq -c '.')"
            gh api \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/actions/variables/MINIO_ENVS \
              -f value="$(echo "$UPDATED" | jq -c '.')"
            echo "ENV_STATUS=added" >> $GITHUB_ENV
          fi

          pip install PyNaCl==1.5.0 -q

          KEY_DATA=$(gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/environments/$SECRETS_ENVIRONMENT/secrets/public-key)
          KEY_ID=$(echo "$KEY_DATA" | jq -r '.key_id')
          KEY=$(echo "$KEY_DATA" | jq -r '.key')

          encrypt_and_set() {
            SECRET_NAME=$1
            SECRET_VALUE=$2
            ENCRYPTED=$(python3 -c "import sys,base64;from nacl import public;k=base64.b64decode(sys.argv[1]);v=sys.argv[2].encode();print(base64.b64encode(public.SealedBox(public.PublicKey(k)).encrypt(v)).decode())" "$KEY" "$SECRET_VALUE")
            gh api \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/environments/$SECRETS_ENVIRONMENT/secrets/$SECRET_NAME \
              -f encrypted_value="$ENCRYPTED" \
              -f key_id="$KEY_ID"
            echo "Secret $SECRET_NAME set in environment $SECRETS_ENVIRONMENT."
          }

          encrypt_and_set "MINIO_${ENV_UPPER}_URL"      "$MINIO_URL"
          encrypt_and_set "MINIO_${ENV_UPPER}_USER"     "$MINIO_USER"
          encrypt_and_set "MINIO_${ENV_UPPER}_PASSWORD" "$MINIO_PASSWORD"

          echo "## Manage MinIO Environment" >> $GITHUB_STEP_SUMMARY
          if [ "$ENV_STATUS" = "added" ]; then
            echo "**Action:** Add" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** $ENV" >> $GITHUB_STEP_SUMMARY
            echo "**Result:** Added to MINIO_ENVS and secrets created in environment $SECRETS_ENVIRONMENT." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Action:** Add (secret rotation)" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** $ENV" >> $GITHUB_STEP_SUMMARY
            echo "**Result:** $ENV already existed — MINIO_ENVS unchanged. Secrets MINIO_${ENV_UPPER}_URL / _USER / _PASSWORD replaced in environment $SECRETS_ENVIRONMENT." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Remove environment
        id: remove_env
        if: inputs.action == 'remove'
        env:
          GH_TOKEN:  ${{ secrets.ACTION_PAT }}
          ENV_NAME:  ${{ steps.validate.outputs.env_name }}
          CURRENT:   ${{ steps.read_envs.outputs.current }}
        run: |
          ENV="$ENV_NAME"
          ENV_UPPER=$(printf '%s' "$ENV" | tr '[:lower:]' '[:upper:]' | tr -c 'A-Z0-9' '_')

          EXISTS=$(echo "$CURRENT" | jq --arg env "$ENV" 'map(select(. == $env)) | length')
          if [ "$EXISTS" -eq 0 ]; then
            # Still clear its secrets: earlier removals left them in the environment.
            echo "Environment '$ENV' not found in MINIO_ENVS — variable unchanged. Checking for leftover secrets."
            LISTED=false
          else
            UPDATED=$(echo "$CURRENT" | jq --arg env "$ENV" 'map(select(. != $env))')
            echo "Updated MINIO_ENVS: $(echo "$UPDATED" | jq -c '.')"

            gh api \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/actions/variables/MINIO_ENVS \
              -f value="$(echo "$UPDATED" | jq -c '.')"
            LISTED=true
          fi

          # The environment holds the secrets the reports use. Older envs may also
          # have a repo-level copy, and some have a _NAME secret; clear all of them.
          DELETED=()
          delete_secret() {
            SCOPE=$1
            SECRET_NAME=$2
            if [ "$SCOPE" = "environment" ]; then
              SECRET_PATH="environments/$SECRETS_ENVIRONMENT/secrets/$SECRET_NAME"
            else
              SECRET_PATH="actions/secrets/$SECRET_NAME"
            fi
            # Only a 404 means "not there". Anything else (e.g. a token without
            # access to environment secrets) must fail the run, not pass as success.
            if OUT=$(gh api -X DELETE -H "Accept: application/vnd.github+json" \
                       /repos/${{ github.repository }}/$SECRET_PATH 2>&1); then
              echo "Secret $SECRET_NAME deleted at $SCOPE level."
              DELETED+=("$SECRET_NAME ($SCOPE)")
            elif grep -q 'HTTP 404' <<< "$OUT"; then
              echo "Secret $SECRET_NAME not present at $SCOPE level."
            else
              echo "::error::Could not delete $SECRET_NAME at $SCOPE level: $OUT"
              exit 1
            fi
          }

          for SUFFIX in URL USER PASSWORD NAME; do
            delete_secret environment "MINIO_${ENV_UPPER}_${SUFFIX}"
            delete_secret repository  "MINIO_${ENV_UPPER}_${SUFFIX}"
          done

          if [ "$LISTED" = true ]; then
            RESULT="Removed from MINIO_ENVS."
          else
            RESULT="Not in MINIO_ENVS — variable unchanged."
          fi
          if [ ${#DELETED[@]} -eq 0 ]; then
            RESULT="$RESULT No MINIO_${ENV_UPPER}_* secrets were found."
          else
            RESULT="$RESULT Deleted: ${DELETED[*]}"
          fi

          if [ "$LISTED" = false ] && [ ${#DELETED[@]} -eq 0 ]; then
            echo "ENV_STATUS=not_found" >> $GITHUB_ENV
          elif [ ${#DELETED[@]} -eq 0 ]; then
            echo "::warning::No MINIO_${ENV_UPPER}_* secrets were found to delete."
            echo "ENV_STATUS=no_secrets" >> $GITHUB_ENV
          elif [ "$LISTED" = false ]; then
            echo "ENV_STATUS=secrets_only" >> $GITHUB_ENV
          fi
          echo "$RESULT"

          echo "## Manage MinIO Environment" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** Remove" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $ENV" >> $GITHUB_STEP_SUMMARY
          echo "**Result:** $RESULT" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.TEST_AUTOMATION_SLACK_WEBHOOK }}
          ADD_OUTCOME:       ${{ steps.add_env.outcome }}
          REMOVE_OUTCOME:    ${{ steps.remove_env.outcome }}
          ACTION:            ${{ inputs.action }}
          ENV_NAME:          ${{ steps.validate.outputs.env_name || inputs.env_name }}
          ACTOR_NAME:        ${{ github.actor }}
          RUN_URL:           ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ENV="$ENV_NAME"
          DATE=$(date +'%d %b %Y %H:%M IST')

          if [ "$ACTION" = "add" ]; then
            STEP_OUTCOME="$ADD_OUTCOME"
          else
            STEP_OUTCOME="$REMOVE_OUTCOME"
          fi

          if [ "${ENV_STATUS:-}" = "not_found" ]; then
            ICON=":information_source:"
            TITLE="MinIO Env Not Found"
            DETAIL="Environment \`$ENV\` was not found in MINIO_ENVS and has no secrets. No changes were made."
          elif [ "$STEP_OUTCOME" != "success" ]; then
            ICON=":warning:"
            TITLE="MinIO Env Change Failed"
            DETAIL="Action \`$ACTION\` for \`$ENV\` failed. Check the run for details."
          elif [ "$ACTION" = "add" ]; then
            if [ "${ENV_STATUS:-added}" = "updated" ]; then
              ICON=":arrows_counterclockwise:"
              TITLE="MinIO Env Secrets Rotated"
              DETAIL="\`$ENV\` already existed — MINIO_ENVS unchanged. Secrets have been replaced."
            else
              ICON=":white_check_mark:"
              TITLE="MinIO Env Added"
              DETAIL="\`$ENV\` has been added to MINIO_ENVS and its secrets created."
            fi
          elif [ "${ENV_STATUS:-}" = "secrets_only" ]; then
            ICON=":x:"
            TITLE="MinIO Env Secrets Removed"
            DETAIL="\`$ENV\` was not in MINIO_ENVS. Its leftover secrets have been deleted."
          elif [ "${ENV_STATUS:-}" = "no_secrets" ]; then
            ICON=":x:"
            TITLE="MinIO Env Removed"
            DETAIL="\`$ENV\` has been removed from MINIO_ENVS. No secrets were found for it."
          else
            ICON=":x:"
            TITLE="MinIO Env Removed"
            DETAIL="\`$ENV\` has been removed from MINIO_ENVS and its secrets deleted."
          fi

          PAYLOAD=$(jq -n \
            --arg title "$ICON $TITLE" \
            --arg detail "$DETAIL" \
            --arg actor "Triggered by: $ACTOR_NAME" \
            --arg date "$DATE" \
            --arg url "$RUN_URL" \
            '{
              blocks: [
                {
                  type: "header",
                  text: { type: "plain_text", text: $title, emoji: true }
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: $detail }
                },
                {
                  type: "context",
                  elements: [
                    { type: "mrkdwn", text: $actor },
                    { type: "mrkdwn", text: $date }
                  ]
                },
                { type: "divider" },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: { type: "plain_text", text: "View Run", emoji: true },
                      url: $url,
                      style: "primary"
                    }
                  ]
                }
              ]
            }')

          curl -fsSL -X POST -H 'Content-type: application/json' \
               --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
